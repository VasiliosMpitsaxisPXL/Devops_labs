name: conditional
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Kies de environment'
        type: choice
        required: true
        default: development
        options:
          - development
          - staging
          - production
jobs:
  build:  
    runs-on: ubuntu-latest
    steps:
      - name: Run production tasks
        if: ${{ github.event.inputs.environment == 'production' }}
        run: echo "Deploying to production!"
      - name: Run development or staging tasks
        if: ${{ github.event.inputs.environment == 'development' or github.event.inputs.environment == 'staging' }}
        run: echo "Running in test mode"
        
